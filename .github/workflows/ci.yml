name: CI

# 质量门禁：分支 push / pull_request 时跑类型检查。
# 限定 branches（不含 tag）：发版时 tag 与 main 指向同一个 commit，裸 on: push 会让同一次提交重复跑两遍。
# paths-ignore：纯文档提交（README / CHANGELOG）没有可查的东西，跳过；提交里只要有一个非 .md 文件即照常触发。
#
# 这里 gate 的是 `tsc --noEmit`，没有直接 gate `npm run check`：后者还含 expo-doctor，
# 而 expo-doctor 目前会报 2 处**既有**的 patch 版本偏差（expo、expo-build-properties），
# 纳入门禁会让 CI 常红。等这两个依赖对齐 SDK 期望版本后，把下面那步换成 `npm run check` 即可。

on:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
